services:
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
      - "5555:5555"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
    - app-network

  db:
    build: ./db
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:
  backend_node_modules:

networks:
  app-network:
    driver: bridge