services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
    - app-network

  db:
    build: ./db
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:
  backend_node_modules:

networks:
  app-network:
    driver: bridge